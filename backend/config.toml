# 本地语音设置。enabled 为 false 时仅显示气泡和表情，不播放声音。
[speech]
# 是否播放本机语音。
enabled = true
# 留空时自动选择已安装的中文语音；也可以填写已安装语音的完整名称。
voice_name = ""

# 宠物待机时主动说话的设置。间隔以秒为单位，每次会在最小与最大值之间随机选择。
[idle]
# 是否启用自动播报；关闭后托盘手动“说句话”仍可用。
enabled = true
# 自动播报的最短等待秒数。
min_interval_seconds = 180
# 自动播报的最长等待秒数。
max_interval_seconds = 300

# CS2 Game State Integration 原始数据录制。默认关闭，避免日常运行持续写盘。
[gsi]
# 为 true 时，每次启动新建一个 JSONL 文件并异步追加收到的原始 payload。
record = false

[events]
# 死亡时若本回合零击杀、存活不足这个秒数、且装备价值不低于下面的门槛，
# 判定为「白给」。数值越小越严格。
thrown_away_max_survival_seconds = 15
thrown_away_min_equip_value = 3000
# 击杀后多少秒内死亡，算作「暴露位置被补枪」，给正反馈而不是负反馈。
death_after_kill_max_seconds = 8

[policy]
# 两次发言之间的最短间隔秒数。数值越大，宠物越安静。
cooldown_seconds = 6
# 每个回合最多发言几次。
max_lines_per_round = 4
# 你还活着、回合进行中时，事件优先级至少要达到多少才允许打断你。
# 数值越高越安静；设为 0 表示活着时也什么都说。
alive_priority_threshold = 0
# 优先级不低于这个值的事件可以打断冷却直接开口。
# 设为 101 表示关闭该机制。
cooldown_override_priority = 70
# 即使打断冷却，两句话之间也至少间隔这么多秒，避免叠音。
minimum_gap_seconds = 2

[personality]
# 宠物的说话风格。brother = 损友兄弟，caster = 比赛解说。
style = "brother"

# 在线模型默认关闭。密钥只从 OPENROUTER_API_KEY 环境变量读取。
[llm]
enabled = false
model = ""
provider = ""
temperature = 0.9
timeout_seconds = 3.0
max_tokens = 256
