[active]
game = "cs2"

# 本地语音设置。enabled 为 false 时仅显示气泡和表情，不播放声音。
[speech]
# 是否播放本机语音。
enabled = true
# 留空时自动选择已安装的中文语音；也可以填写已安装语音的完整名称。
voice_name = ""

# 宠物待机时主动说话的设置。间隔以秒为单位，每次会在最小与最大值之间随机选择。
[idle]
# 是否启用自动播报；关闭后托盘手动“说句话”仍可用。
enabled = true
# 自动播报的最短等待秒数。
min_interval_seconds = 180
# 自动播报的最长等待秒数。
max_interval_seconds = 300

# CS2 Game State Integration 原始数据录制。默认关闭，避免日常运行持续写盘。
[games.cs2.gsi]
# 为 true 时，每次启动新建一个 JSONL 文件并异步追加收到的原始 payload。
record = false

[games.cs2.events]
# 死亡时若本回合零击杀、存活不足这个秒数、且装备价值不低于下面的门槛，
# 判定为「白给」。数值越小越严格。
thrown_away_max_survival_seconds = 15
thrown_away_min_equip_value = 3000
# 击杀后多少秒内死亡，算作「暴露位置被补枪」，给正反馈而不是负反馈。
death_after_kill_max_seconds = 8

[games.cs2.policy]
# 两次发言之间的最短间隔秒数。数值越大，宠物越安静。
cooldown_seconds = 6
# 每个回合最多发言几次。
max_lines_per_round = 4
# 你还活着、回合进行中时，事件优先级至少要达到多少才允许打断你。
# 数值越高越安静；设为 0 表示活着时也什么都说。
alive_priority_threshold = 0
# 优先级不低于这个值的事件可以打断冷却直接开口。
# 设为 101 表示关闭该机制。
cooldown_override_priority = 70
# 即使打断冷却，两句话之间也至少间隔这么多秒，避免叠音。
minimum_gap_seconds = 2
# 连杀暂存后，最多等待多久才作废。与 5 秒连杀窗口一致。
follow_up_max_age_seconds = 5
# 连杀最后一次升级后等待多久再播报，避免逐级播报互相打断。
streak_settle_seconds = 2.5

[games.cs2.personality]
# 宠物的说话风格。brother = 损友兄弟，caster = 比赛解说。
style = "brother"

# 通用视觉适配默认关闭；只有 active.game="generic" 且 enabled=true 才截屏和调用模型。
[games.generic]
enabled = false
poll_interval_seconds = 1.0
send_width = 896
fast_timeout_seconds = 5.0
max_inflight = 4
input_context = true
observation_log_dir = "recordings/observation"
# 待实测：吸收原 region_sparsity_max=0.25 与粗定位档，只控制是否提供聚焦区域。
region_focus_max = 0.50
llm_profile = "vision_fast"
cost_warn_per_hour = 1.0

[games.generic.ocr]
enabled = true
engine = "rapidocr-ppocrv6-tiny-openvino"
num_threads = 2
det_limit_side_len = 1280
language = "zh-Hans-CN"
model_dir = "models/ocr"

[games.generic.scene]
enabled = true
# 四段完整 1080p 录像按 no_change 噪声底重校；逐行推导见 eval-reports/m5-b-t2-2/report.md。
hash_kind = "phash"
hash_bits = 64
hamming_threshold = 8
stable_min_seconds = 4.0
# 刷新周期是 TD-28 待实测占位；驻留时长只记录，不再作为上卡门。
card_flush_seconds = 120
memory_dir = "memory"

[games.generic.scene.naming]
enabled = true
llm_profile = "scene_fingerprint_verifier"
# 四段校准录像单会话最多出现 4 个稳定簇；8 留出一倍余量，同时限制异常簇风暴的花费。
max_requests_per_session = 8
representative_frame_count = 3
# 场景指纹核查图片保持原始宽高比缩放到 1920px；16:9 帧即 1920x1080。
upload_width = 1920

[games.generic.knowledge]
enabled = true
llm_profile = "game_knowledge"
# T3a：P90 5 秒、最大 6 秒；总墙钟 10 秒留 4 秒余量，不重试。
wall_timeout_seconds = 10.0
# 待实测：B-T8 才接消费者；当前渲染器用 UTF-8 字节作保守 token 硬顶。
short_view_token_limit = 512

# 在线模型默认关闭。密钥只从 OPENROUTER_API_KEY 环境变量读取。
[llm]
enabled = true
model = "qwen/qwen3.5-122b-a10b"
provider = "Alibaba"
temperature = 0.9
timeout_seconds = 3.0
max_tokens = 256

# 快线视觉档位。锁定单一上游并禁止回退的请求参数由 core/llm.py 统一生成。
[llm.profiles.vision_fast]
enabled = true
model = "qwen/qwen3.7-flash"
provider = "alibaba"
temperature = 0.0
timeout_seconds = 5.0
max_tokens = 200
input_price_per_million_usd = 0.03
output_price_per_million_usd = 0.13

# 场景指纹核查模型；目标 6 秒内返回，10 秒失败截止避免把轻微尾延迟误判为调用失败。
[llm.profiles.scene_fingerprint_verifier]
enabled = true
model = "qwen/qwen3.8-flash"
provider = "Alibaba"
temperature = 0.0
timeout_seconds = 10.0
max_tokens = 1024
input_price_per_million_usd = 0.15
output_price_per_million_usd = 0.47

# 游戏知识线：T3a 定案，仅默认 OpenRouter 端点的 Exa web_search。
[llm.profiles.game_knowledge]
enabled = true
model = "google/gemini-3.1-flash-lite"
# 空字符串表示 OpenRouter 自动路由，不继承顶层的 Alibaba 锁定。
provider = ""
temperature = 0.0
timeout_seconds = 10.0
max_tokens = 8000
